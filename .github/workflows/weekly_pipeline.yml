name: Weekly booking health report

on:
  schedule:
    - cron: "0 1 * * 1"  # 08:00 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:
    inputs:
      week:
        description: "Ngày thứ Hai đầu tuần (YYYY-MM-DD), bỏ trống = tuần gần nhất"
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (logic hỏng -> dừng, không gửi báo cáo)
        run: python -m pytest -q
      - name: Run pipeline and email each department
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m src.pipeline --notify --send-email ${{ inputs.week && format('--week {0}', inputs.week) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            reports/weekly/
            reports/BAO_CAO_MOI_NHAT.xlsx
